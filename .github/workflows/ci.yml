# Vérifications automatiques à chaque push et pull request : analyse + tests.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.10
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse (les avertissements « info » font aussi échouer)
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tests du moteur de téléchargement (Kotlin)
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest
